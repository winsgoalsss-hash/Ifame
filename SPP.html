<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Header</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
      background: transparent;
      color: #fff;
      text-align: center;
      overflow-x: hidden;
    }

    .shadowed-image {
  border-radius: 20px;
  box-shadow: 0 10px 10px rgba(0,0,0,0.25);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.shadowed-image:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 15px rgba(0,0,0,0.3);
}
  </style>
</head>

<body>
<img src="https://img2.pic.in.th/pic/-SP.jpg" class="shadowed-image" width="500" style="border-radius:20px;box-shadow:0 10px 20px rgba(0,0,0,0.3);max-width:90%;margin-top:20px;" alt="banner">
</body>
</html>
